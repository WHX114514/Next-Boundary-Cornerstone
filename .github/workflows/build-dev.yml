name: 构建 Dev (1.21.1)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（留空使用 gradle.properties）'
        required: false
        default: ''
        type: string

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并上传
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 替换 Gradle 官方源
        run: |
          sed -i -E 's|https\\://mirrors.aliyun.com/github/releases/gradle/gradle-distributions/v[^/]+|https\\://services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 权限
        run: chmod +x gradlew

      - name: 构建 JAR
        id: build
        env:
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          version=${CUSTOM_VERSION:-$(sed -n 's/^mod_version=//p' gradle.properties)}
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+-(alpha|beta|release)(-hotfix[0-9]*)?$ ]]; then
            echo "::error::模组版本号格式无效，需符合 版本号-(alpha|beta|release)[-hotfixN]"
            exit 1
          fi
          short_sha=$(git rev-parse --short=8 HEAD)
          dev_version="${version}-${short_sha}"
          printf 'sha=%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
          ./gradlew build -PdevBuild "-Pmod_version=$dev_version" --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cornerstone-1.21.1-dev.${{ github.run_number }}-${{ steps.build.outputs.sha }}
          path: build/libs/cornerstone-1.21.1-dev-*.jar
          if-no-files-found: error
          retention-days: 14
