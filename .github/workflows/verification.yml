name: 验证 (1.20.1 Forge)

on:
  push:
    branches: [ 1.20-forge ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ 1.20-forge ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 运行验证
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 替换 Gradle 官方源
        run: |
          sed -i -E 's|https\\://mirrors.aliyun.com/github/releases/gradle/gradle-distributions/v[^/]+|https\\://services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 权限
        run: chmod +x gradlew

      - name: 运行单元测试 (check)
        run: ./gradlew check --no-daemon

      - name: 运行独立 GameTest
        run: ./gradlew runGameTestServer --no-parallel --no-daemon

      - name: 运行 TaCZ GameTest
        run: ./gradlew runGameTestServer -PtaczRuntime=true --no-parallel --no-daemon

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: build/forge-game-test/logs/
          if-no-files-found: ignore
          retention-days: 7
