name: 核心逻辑与物理回归验证 (1.21.1 NeoForge)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 物理模型与服务端集成验证
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置 JDK 21 运行环境
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 初始化 Gradle 缓存与环境
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 运行纯数学/几何/物理回归测试（表面吸附、16段受击盒、OBB、复合物理碰撞、自由观察、视点与镜头旋转）
      - name: 运行数值几何与物理模型回归
        run: ./gradlew check --no-daemon

      # 运行纯净服务端 GameTestServer（验证贴壁运行时、真实半砖/楼梯接缝碰撞与受击盒结构）
      - name: 运行独立服务端运行时验证 (GameTestServer)
        run: ./gradlew runGameTestServer --no-parallel --no-daemon

      # 运行包含 TaCZ 运行时的服务端 GameTestServer（覆盖 52 个失重弹道场景与镜头动效兼容性）
      - name: 运行 TaCZ 弹道与镜头兼容验证 (GameTestServer)
        run: ./gradlew runGameTestServer -PtaczRuntime=true --no-parallel --no-daemon

      # 验证失败时自动归档服务端日志供排查
      - name: 验证失败时归档服务端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-server-logs
          path: build/surface-game-test/logs/
          if-no-files-found: ignore
          retention-days: 7
