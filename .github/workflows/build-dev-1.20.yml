name: 构建 Dev (1.20.1 Forge)

on:
  push:
    branches: [ 1.20-forge ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      custom_version:
        description: '自定义版本号（留空自动生成）'
        required: false
        default: ''
        type: string

concurrency:
  group: build-dev-1.20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并上传
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 替换 Gradle 官方源
        run: |
          sed -i -E 's|https\\://mirrors.aliyun.com/github/releases/gradle/gradle-distributions/v[^/]+|https\\://services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 权限
        run: chmod +x gradlew

      - name: 计算版本号
        id: resolve-version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BASE_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          if [ -n "${{ inputs.custom_version }}" ]; then
            RESOLVED_VERSION="${{ inputs.custom_version }}"
          else
            RESOLVED_VERSION="${BASE_VERSION}-dev.b${{ github.run_number }}.${SHORT_SHA}"
          fi
          
          echo "version=${RESOLVED_VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Target version: ${RESOLVED_VERSION}"

      - name: 构建 jar
        run: ./gradlew build -x downloadAssets -Pmod_version=${{ steps.resolve-version.outputs.version }} --no-daemon

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: next_boundary_cornerstone-forge1.20.1-${{ steps.resolve-version.outputs.version }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
