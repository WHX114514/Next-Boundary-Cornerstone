plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.115'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}

version = project.mod_version
group = 'cn.rbq108.nextboundary.cornerstone'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://maven.firstdark.dev/snapshots'
        content { includeGroup 'com.lowdragmc.photon'; includeGroup 'com.lowdragmc.ldlib2' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = "next-boundary-cornerstone-neoforge${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Dependency-free numerical checks, plus opt-in runtime verification excluded from the JAR.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
sourceSets.create('gameTest') {
    java.srcDirs = ['src/test/server/java']
    resources.srcDirs = ['src/test/server/resources']
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
sourceSets.create('clientQa') {
    java.srcDirs = ['src/test/client/java']
    resources.srcDirs = ['src/test/client/resources']
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
def surfaceGameTestMod = project.container(net.neoforged.moddevgradle.dsl.ModModel).create(mod_id)
surfaceGameTestMod.sourceSet(sourceSets.main)
surfaceGameTestMod.sourceSet(sourceSets.gameTest)
def surfaceClientMainMod = project.container(net.neoforged.moddevgradle.dsl.ModModel).create(mod_id)
surfaceClientMainMod.sourceSet(sourceSets.main)
def surfaceClientQaMod = project.container(net.neoforged.moddevgradle.dsl.ModModel).create('cornerstone_surface_qa')
surfaceClientQaMod.sourceSet(sourceSets.clientQa)

tasks.register('surfaceTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.rbq108.nextboundarycornerstone.motion.SurfaceAdhesionTests'
}
tasks.named('check') { dependsOn tasks.named('surfaceTest') }

tasks.register('hitboxTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.rbq108.nextboundarycornerstone.body.SegmentedHitboxTests'
}

tasks.named('check') { dependsOn tasks.named('hitboxTest') }

tasks.register('obbTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.rbq108.nextboundarycornerstone.body.OOBB.OBBTests'
}

tasks.named('check') { dependsOn tasks.named('obbTest') }

// Only the isolated QA directory is touched. Disable FML's pre-Mixin splash window so the
// test-only background window hints can suppress focus/visibility before window creation.
def surfaceQaConfig = layout.buildDirectory.file('surface-client-qa/config/fml.toml')
def surfaceQaOptions = layout.buildDirectory.file('surface-client-qa/options.txt')
tasks.register('prepareSurfaceQaConfig') {
    doLast {
        def config = surfaceQaConfig.get().asFile
        config.parentFile.mkdirs()
        def contents = config.exists() ? config.getText('UTF-8') : ''
        if (contents =~ /(?m)^earlyWindowControl\s*=/) {
            contents = contents.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
        } else contents += '\nearlyWindowControl = false\n'
        config.setText(contents, 'UTF-8')
        def options = surfaceQaOptions.get().asFile
        def optionText = options.exists() ? options.getText('UTF-8') : ''
        if (optionText =~ /(?m)^fullscreen:/) optionText = optionText.replaceAll(/(?m)^fullscreen:.*$/, 'fullscreen:false')
        else optionText += '\nfullscreen:false\n'
        options.setText(optionText, 'UTF-8')
    }
}
tasks.matching { it.name == 'runSurfaceClient' }.configureEach {
    dependsOn tasks.named('prepareSurfaceQaConfig')
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        surfaceClient {
            client()
            sourceSet = sourceSets.clientQa
            loadedMods = [surfaceClientMainMod, surfaceClientQaMod]
            gameDirectory = layout.projectDirectory.dir('build/surface-client-qa')
            systemProperty 'cornerstone.surface.qa', 'true'
            systemProperty 'cornerstone.surface.physical', providers.gradleProperty('surfacePhysicalInput').getOrElse('false')
        }
        hitboxVisualClient {
            client()
            sourceSet = sourceSets.clientQa
            loadedMods = [surfaceClientMainMod, surfaceClientQaMod]
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('hitboxVisualDir').getOrElse('.local-artifacts/hitbox-visual') + '/game')
            systemProperty 'cornerstone.hitbox.visual', 'true'
            systemProperty 'cornerstone.hitbox.visual.scenario', providers.gradleProperty('hitboxVisualScenario').getOrElse('all')
            systemProperty 'cornerstone.hitbox.visual.expectedMode', providers.gradleProperty('hitboxExpectedMode').getOrElse('')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            loadedMods = [surfaceGameTestMod]
            gameDirectory = layout.projectDirectory.dir('build/surface-game-test')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    compileOnly('com.lowdragmc.photon:photon-neoforge-1.21.1:2.2.8:all') { transitive = false }
    compileOnly('com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:2.2.42:all') { transitive = false }
    compileOnly "maven.modrinth:OypNE65K:wPvGWIj9"
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
kotlin {
    jvmToolchain(21)
}
