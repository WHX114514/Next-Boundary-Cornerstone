buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.20.1'

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            // Avoid the JVM reserving several gigabytes at startup on a machine
            // already running IDEA and Gradle. Tests can set a smaller heap below.
            jvmArgs '-Xms256m', '-Xmx1536m'
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
    repositories {
        flatDir {
            dir 'libs'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

def taczDevVersion = providers.gradleProperty('taczRuntimeVersion').getOrElse('4yAbMXbz')

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.6"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.6") {
        jarJar.ranged(it, "[0.3.6,)")
    })
    compileOnly fg.deobf("maven.modrinth:SzzJttH8:${taczDevVersion}")
    if (providers.gradleProperty('taczRuntime').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:SzzJttH8:${taczDevVersion}")
    }
    if (providers.gradleProperty('playerAnimatorRuntime').getOrElse('false').toBoolean()) {
        runtimeOnly fg.deobf('maven.modrinth:gedNE4y2:xe2EVE6q')
    }
    // Optional QA fixtures; none are installed or bundled by default.
    def compatibilityFixtures = [rehooked: ['967kkKiF:yiXoBbe7', 'vvuO3ImH:IPQlZkz1'],
            hookshot: ['9qO7cNSI:v77pBX1V'], advanced: ['g8IglZRr:yFTImCbk', 'EgS8gGp8:fVjtdSoU'],
            spartan: ['icU5P2Mk:4U6gwadt'], immersive: ['tIm2nV03:WUzj4tgJ']]
    providers.gradleProperty('compatQaMods').getOrElse('').split(',').findAll().each { fixture ->
        if (!compatibilityFixtures.containsKey(fixture)) throw new GradleException("Unknown QA fixture: ${fixture}")
        compatibilityFixtures[fixture].each { runtimeOnly fg.deobf("maven.modrinth:${it}") }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

def isDevBuild = providers.gradleProperty('devBuild').isPresent()
// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    archiveFileName = isDevBuild
            ? "cornerstone-${minecraft_version}-dev-${version}-slim.jar"
            : "next-boundary-cornerstone-forge-${minecraft_version}-${version}-slim.jar"
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveFileName = isDevBuild
            ? "cornerstone-${minecraft_version}-dev-${version}.jar"
            : "next-boundary-cornerstone-forge-${minecraft_version}-${version}.jar"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// Pure math regressions shared with the NeoForge implementation.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
['surfaceTest': 'motion.SurfaceAdhesionTests', 'hitboxTest': 'body.SegmentedHitboxTests',
 'obbTest': 'body.OOBB.OBBTests', 'physicsTest': 'body.collision.CompoundPhysicsTests',
 'freeLookTest': 'body.FreeLookTests', 'bodyEyesTest': 'body.BodyEyesTests',
 'cameraRotationTest': 'camera.CameraRotationTests'].each { taskName, entry ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'cn.rbq108.nextboundarycornerstone.' + entry
        workingDir file('build/numerical-tests')
        doFirst { workingDir.mkdirs() }
    }
    tasks.named('check') { dependsOn tasks.named(taskName) }
}

sourceSets.create('gameTest') {
    java.srcDirs = ['src/test/server/java']
    resources.srcDirs = ['src/test/server/resources']
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
minecraft.runs.gameTestServer {
    jvmArgs '-Xmx1G', '-XX:ActiveProcessorCount=4'
    workingDirectory project.file('build/forge-game-test')
    mods {
        "${mod_id}" { source sourceSets.gameTest }
    }
}

// IDEA Application runs otherwise inherit the project's JDK (which can still be
// Java 21 after switching from the NeoForge branch). Keep generated Forge runs
// on the same Java 17 toolchain as Gradle launches.
tasks.matching { it.name == 'genIntellijRuns' }.configureEach {
    doLast {
        def runtimeHome = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }.get().metadata.installationPath.asFile.absolutePath
        fileTree('.idea/runConfigurations').matching {
            include 'runClient.xml', 'runServer.xml', 'runData.xml', 'runGameTestServer.xml', 'runForgeClientQa.xml'
        }.each { configFile ->
            def document = new XmlParser().parse(configFile)
            def configuration = document.configuration[0]
            configuration.option.findAll {
                it.@name in ['ALTERNATIVE_JRE_PATH', 'ALTERNATIVE_JRE_PATH_ENABLED']
            }.each { configuration.remove(it) }
            configuration.appendNode('option', [name: 'ALTERNATIVE_JRE_PATH', value: runtimeHome])
            configuration.appendNode('option', [name: 'ALTERNATIVE_JRE_PATH_ENABLED', value: 'true'])
            configFile.setText(groovy.xml.XmlUtil.serialize(document), 'UTF-8')
        }
    }
}

sourceSets.create('clientQa') {
    java.srcDirs = ['src/test/client/java']
    resources.srcDirs = ['src/test/client/resources']
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
def clientQaDirectory = file(providers.gradleProperty('qaDirectory').getOrElse('build/forge-client-qa'))
tasks.register('prepareForgeClientQa') {
    doLast {
        def config = new File(clientQaDirectory, 'game/config/fml.toml')
        config.parentFile.mkdirs()
        config.setText('earlyWindowControl = false\n', 'UTF-8')
        def options = new File(clientQaDirectory, 'game/options.txt')
        def optionLines = options.isFile() ? options.readLines('UTF-8').findAll {
            !it.startsWith('fullscreen:') && !it.startsWith('soundCategory_master:')
        } : []
        options.setText((optionLines + ['fullscreen:false', 'soundCategory_master:0.0']).join('\n') + '\n', 'UTF-8')
        if (['taczQa', 'gunModelQa', 'compatQa', 'lifecycleQa'].any { providers.gradleProperty(it).getOrElse('false').toBoolean() }) {
            def defaults = new File(clientQaDirectory, 'game/defaultconfigs/next-boundary-hitbox-server.toml')
            defaults.parentFile.mkdirs()
            defaults.setText('[Zero_Gravity_Hitboxes]\nMode = "' + providers.gradleProperty('qaHitboxMode').getOrElse('AABB') + '"\n', 'UTF-8')
        }
    }
}
minecraft.runs {
    forgeClientQa {
        jvmArgs '-Xmx1G', '-XX:ActiveProcessorCount=4', '-Dapple.awt.UIElement=true', '-Djava.awt.headless=true'
        property 'cornerstone.qa.pauseOnly', providers.gradleProperty('pauseMenuQa').getOrElse('false')
        property 'cornerstone.qa.lifecycle', providers.gradleProperty('lifecycleQa').getOrElse('false')
        property 'cornerstone.qa.dedicated', providers.gradleProperty('dedicatedQa').getOrElse('false')
        property 'cornerstone.qa.transitions', providers.gradleProperty('transitionQa').getOrElse('false')
        property 'cornerstone.qa.compat', providers.gradleProperty('compatQa').getOrElse('false')
        property 'cornerstone.qa.baseline', providers.gradleProperty('compatQaBaseline').getOrElse('false')
        property 'cornerstone.qa.camera', providers.gradleProperty('cameraQa').getOrElse('false')
        property 'cornerstone.qa.tacz', providers.gradleProperty('taczQa').getOrElse('false')
        property 'cornerstone.qa.gunModel', providers.gradleProperty('gunModelQa').getOrElse('false')
        property 'cornerstone.qa.taczCases', providers.gradleProperty('taczQaCases').getOrElse('32')
        property 'cornerstone.qa.hitboxMode', providers.gradleProperty('qaHitboxMode').getOrElse('AABB')
        parent minecraft.runs.client
        workingDirectory new File(clientQaDirectory, 'game')
        args '--width', '1440', '--height', '1000', '--mixin.config', 'cornerstone.forge.qa.mixins.json'
        mods {
            cornerstone_forge_qa { source sourceSets.clientQa }
        }
    }
}
tasks.matching { it.name == 'runForgeClientQa' }.configureEach {
    dependsOn tasks.named('prepareForgeClientQa')
    doFirst { new File(clientQaDirectory, 'client-report.txt').delete() }
    doLast {
        def report = new File(clientQaDirectory, 'client-report.txt')
        if (!report.isFile() || !report.text.startsWith('PASS '))
            throw new GradleException("Forge client QA failed; inspect ${clientQaDirectory}/game/logs/latest.log")
    }
}

// Opt-in, real TCP/anti-floating regression. No optional mods are required.
if (providers.gradleProperty('dedicatedQa').getOrElse('false').toBoolean()) {
    tasks.register('prepareDedicatedFlightQa') {
        doLast {
            def directory = file('build/general-compat-qa/dedicated-server')
            directory.mkdirs()
            new File(directory.parentFile, 'dedicated-server-report.txt').delete()
            new File(directory, 'eula.txt').text = 'eula=true\n'
            new File(directory, 'server.properties').text = 'server-ip=127.0.0.1\nserver-port=25579\nonline-mode=false\nallow-flight=false\nview-distance=3\nsimulation-distance=3\nspawn-protection=0\nlevel-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1}],"biome":"minecraft:plains"}\ngenerate-structures=false\nmax-tick-time=0\n'
        }
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        dependsOn tasks.named('prepareDedicatedFlightQa')
    }
    minecraft.runs.server {
        workingDirectory project.file('build/general-compat-qa/dedicated-server')
        property 'cornerstone.qa.dedicated', 'true'
        mods { "${mod_id}" { source sourceSets.gameTest } }
    }
}
